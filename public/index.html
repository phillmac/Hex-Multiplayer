<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hex Engine RTS Multiplayer (Infinite)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Hex Engine RTS — Infinite</h1>
    <div id="hud">
      <span id="player"></span>
      <span id="credits"></span>
      <span id="stats"></span>
      <span id="hint">Click hex to cycle class/type • Drag to pan • Shift+Wheel to zoom</span>
    </div>
  </header>
  <canvas id="board" width="1280" height="800"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
